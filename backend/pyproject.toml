[project]
name = "workscribe-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--strict-markers", "--tb=short"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Deliberately narrow: correctness rules (pyflakes) plus basic style and import
# ordering. Bugbear and pyupgrade were tried and flagged ~180 pre-existing
# issues; enabling them would mean a red pipeline from day one, which trains
# everyone to ignore CI. Add them once the backlog is cleared.
select = ["E", "F", "W", "I"]
ignore = [
    # SQLAlchemy filter expressions REQUIRE `Column == False` to build the SQL
    # boolean clause. Ruff's suggested `not Column` evaluates in Python and
    # silently produces the wrong query, so this rule must stay off for a
    # codebase that writes queries this way.
    "E712",
    # Long lines are mostly docstrings and error messages; not worth churn.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Model and migration modules import names purely to register them with
# SQLAlchemy's metadata, so "unused" imports there are load-bearing.
"app/models/__init__.py" = ["F401"]
"alembic/env.py" = ["F401"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
