# Render blueprint for the WorkScribe API.
#
# Mirrors the existing manually-created service (Docker runtime, rootDir
# backend, Singapore region). An existing service does NOT pick these settings
# up automatically — this file documents them so the service can be rebuilt
# from scratch, and so the settings below are reviewable in git.
#
# The two settings that matter most:
#   preDeployCommand — runs migrations before the new instance starts. When a
#     free-tier database expires and is recreated, the new database is empty;
#     without this the API boots against a schema-less database and every
#     request fails with an undefined-table error that is indistinguishable
#     from a connection failure.
#   healthCheckPath  — /health is liveness only. It deliberately does NOT touch
#     the database, so a dependency outage does not cause Render to
#     restart-loop an otherwise healthy process. Use /health/ready manually to
#     diagnose which dependency is down.

services:
  - type: web
    name: workscribe-api
    runtime: docker
    repo: https://github.com/ayushi-shahi/WorkScribe
    branch: main
    region: singapore
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .

    preDeployCommand: alembic upgrade head
    healthCheckPath: /health

    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO

      # Secrets — set these in the Render dashboard, never commit them.
      - key: JWT_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # Origins the browser calls this API from. Accepts a single origin, a
      # comma-separated list, or a JSON array. No trailing slashes.
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false

      # Must be an address verified with the email provider.
      - key: EMAIL_FROM
        value: workscribe.noreply@gmail.com

      # Keep the pool small: free-tier Postgres allows very few connections and
      # each web worker opens its own pool.
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"

      # Set to true only when DATABASE_URL points at a transaction-mode pooler
      # (Supabase port 6543 / PgBouncer). Neon's direct endpoint does not need it.
      - key: DB_USE_PGBOUNCER
        value: "false"
